name: Build Assistane Viewer

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ASSISTANE_API_BASE_URL: https://api.assistane.com
  ASSISTANE_DOWNLOADS_BUCKET: assistane-remote-prod-downloadsbucket-mszqgdqc3ygb
  ASSISTANE_DOWNLOADS_DISTRIBUTION_ID: ${{ secrets.ASSISTANE_DOWNLOADS_DISTRIBUTION_ID }}
  HAS_AWS_CREDS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: electron-viewer/package-lock.json
      - run: npm ci
      - name: Create build config
        run: |
          node -e "require('fs').writeFileSync('app-config.local.json', JSON.stringify({ apiBaseUrl: process.env.ASSISTANE_API_BASE_URL, apiKey: process.env.ASSISTANE_API_KEY || '' }, null, 2))"
        env:
          ASSISTANE_API_KEY: ${{ secrets.ASSISTANE_API_KEY }}
      - run: npm run build:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: assistane-viewer-windows
          path: electron-viewer/dist/Assistane.Viewer.Setup.exe
      - name: Configure AWS credentials
        if: env.HAS_AWS_CREDS == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Publish Windows Viewer to AWS downloads
        if: env.HAS_AWS_CREDS == 'true'
        run: |
          aws s3 cp dist/Assistane.Viewer.Setup.exe "s3://$env:ASSISTANE_DOWNLOADS_BUCKET/viewer/windows/Assistane.Viewer.Setup.exe" --content-type "application/vnd.microsoft.portable-executable"
      - name: Invalidate AWS download cache
        if: env.HAS_AWS_CREDS == 'true' && env.ASSISTANE_DOWNLOADS_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation --distribution-id "$env:ASSISTANE_DOWNLOADS_DISTRIBUTION_ID" --paths "/viewer/windows/Assistane.Viewer.Setup.exe"

  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: electron-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: electron-viewer/package-lock.json
      - run: npm ci
      - name: Create build config
        run: |
          node -e "require('fs').writeFileSync('app-config.local.json', JSON.stringify({ apiBaseUrl: process.env.ASSISTANE_API_BASE_URL, apiKey: process.env.ASSISTANE_API_KEY || '' }, null, 2))"
        env:
          ASSISTANE_API_KEY: ${{ secrets.ASSISTANE_API_KEY }}
      - run: npm run build:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: assistane-viewer-macos
          path: electron-viewer/dist/Assistane.Viewer.dmg
      - name: Configure AWS credentials
        if: env.HAS_AWS_CREDS == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Publish macOS Viewer to AWS downloads
        if: env.HAS_AWS_CREDS == 'true'
        run: |
          aws s3 cp dist/Assistane.Viewer.dmg "s3://$ASSISTANE_DOWNLOADS_BUCKET/viewer/macos/Assistane.Viewer.dmg" --content-type "application/x-apple-diskimage"
      - name: Invalidate AWS download cache
        if: env.HAS_AWS_CREDS == 'true' && env.ASSISTANE_DOWNLOADS_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation --distribution-id "$ASSISTANE_DOWNLOADS_DISTRIBUTION_ID" --paths "/viewer/macos/Assistane.Viewer.dmg"